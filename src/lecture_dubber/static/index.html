<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>lecture-dubber</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background:#f4f6f9; margin:0;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .wrap { text-align:center; }
  h1 { font-size:28px; color:#1c2733; margin-bottom:6px; }
  .sub { color:#68788c; margin-bottom:36px; }
  .modes { display:flex; gap:24px; justify-content:center; }
  a.card { display:block; width:300px; padding:28px 24px; background:#fff; border-radius:14px;
           text-decoration:none; color:inherit; border:1px solid #e3e9f0; text-align:left;
           transition: box-shadow .15s, transform .15s; }
  a.card:hover { box-shadow:0 8px 24px rgba(30,60,100,.12); transform:translateY(-2px); }
  .icon { font-size:34px; }
  a.card h2 { margin:12px 0 8px; font-size:19px; color:#15324f; }
  a.card p { margin:0; color:#68788c; font-size:14px; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>lecture-dubber</h1>
    <div class="sub">本地讲座视频英→中配音 &amp; 实时同传</div>
    <div class="modes">
      <a class="card" href="/realtime">
        <div class="icon">🎧</div>
        <h2>实时同传</h2>
        <p>选择一个正在播放英文声音的程序（如后台挂着的直播/视频），
           实时输出中文配音。无需下载视频、无需等待处理。</p>
      </a>
      <a class="card" href="/offline">
        <div class="icon">🎬</div>
        <h2>离线配音</h2>
        <p>输入本地视频 / B 站缓存目录 / 视频链接，
           完整处理为中文配音视频（WhisperX → 翻译 → TTS → 渲染）。</p>
      </a>
    </div>
  </div>
</body>
</html>
