[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecture-dubber"
version = "0.1.0"
description = "Local-first cross-language dubbing pipeline for lectures and educational videos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
asr = ["whisperx>=3.3"]
tts = ["soundfile>=0.12", "numpy>=1.26"]
realtime = ["proc-tap>=1.1", "SoundCard>=0.4", "pycaw>=20240210", "psutil>=5.9", "piper-tts>=1.8", "sounddevice>=0.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dubber = "lecture_dubber.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_dubber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# typer's function-call option defaults are the framework idiom, not a bug.
# BLE001: `dubber doctor` deliberately probes optional imports with a broad catch.
# TRY004: glossary validation reports bad config content, so ValueError is right.
# S112: frame sampling in the QC path is best-effort by design.
# S110: the llama-server slot erase is best-effort too.
ignore = ["B008", "BLE001", "TRY004", "S112", "S110"]
